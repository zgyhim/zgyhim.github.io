<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>入群代碼</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f8fafc;
        }

        .card {
            background-color: #fffbeb;
            border: 1px solid #fcd34d;
            border-radius: 8px;
            padding: 24px;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .header {
            margin-bottom: 16px;
        }

        .header h2 {
            color: #92400e;
            margin: 0 0 4px 0;
            font-size: 18px;
            font-weight: 700;
        }

        .header p {
            color: #b45309;
            margin: 0;
            font-size: 13px;
        }

        .code-container {
            position: relative;
        }

        .code-block {
            background-color: #1e293b;
            border-radius: 6px;
            padding: 16px 20px;
            padding-right: 80px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 18px;
            line-height: 1.5;
            border: 1px solid #334155;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            overflow-x: auto;
        }

        .code-text {
            color: #34d399;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .copy-btn {
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #94a3b8;
            font-size: 13px;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            z-index: 10;
        }

        .copy-btn:hover {
            background-color: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .copy-btn.success {
            color: #34d399;
            border-color: #34d399;
            background-color: rgba(52, 211, 153, 0.1);
        }

        .copy-btn.error {
            color: #f87171;
            border-color: #f87171;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <h2>感謝閱讀</h2>
            <p>憑此代碼入群</p>
        </div>

        <div class="code-container">
            <button onclick="copyCode(this)" class="copy-btn" id="copyBtn">複製</button>

            <div class="code-block">
                <span id="targetCode" class="code-text">37858284</span>
            </div>
        </div>
    </div>

    <script>
        function copyCode(btnElement) {
            const codeElement = document.getElementById('targetCode');
            const textToCopy = codeElement.innerText.trim();
            const originalText = "複製";

            const handleSuccess = () => {
                btnElement.innerText = "已複製!";
                btnElement.classList.add('success');
                setTimeout(() => {
                    btnElement.innerText = originalText;
                    btnElement.classList.remove('success');
                }, 2000);
            };

            const handleError = () => {
                btnElement.innerText = "失敗";
                btnElement.classList.add('error');
                setTimeout(() => {
                    btnElement.innerText = originalText;
                    btnElement.classList.remove('error');
                }, 2000);
            };

            try {
                const range = document.createRange();
                range.selectNodeContents(codeElement);
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(range);
                const ok = document.execCommand('copy');
                sel.removeAllRanges();
                ok ? handleSuccess() : handleError();
            } catch(e) {
                handleError();
            }
        }
    </script>
</body>
</html>
